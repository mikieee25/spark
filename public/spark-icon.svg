<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DOE SPARK icon</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#0016A8" stroke-width="1.4" opacity="0.35"/>
    </pattern>
    <clipPath id="tailClip">
      <path d="M236,274 194,460 330,222 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="108" fill="#0016A8"/>
  <rect x="3" y="3" width="506" height="506" rx="105" fill="none" stroke="#0341CB" stroke-width="2" opacity="0.5"/>

  <!-- 4-facet crystalline bolt -->
  <path d="M296,56 182,274 236,274 Z" fill="#FFFE77" stroke="#0016A8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M236,274 276,222 296,56 Z" fill="#FFEE4D" stroke="#0016A8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M236,274 330,222 276,222 Z" fill="#FADB09" stroke="#0016A8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M236,274 194,460 330,222 Z" fill="#E8B911" stroke="#0016A8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- fine hatch texture on the tail facet -->
  <rect x="150" y="200" width="220" height="280" fill="url(#hatch)" clip-path="url(#tailClip)" opacity="0.5"/>
</svg>
